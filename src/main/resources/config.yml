# SimpleRTP config file

# Whether players will be randomly teleported automatically upon their first time joining
random-teleport-on-first-join: true

# If a region has less than the given amount of tps, it will be less likely to have players spawn inside of it on first join. (Folia only)
first-join-spawn-min-tps: -1

respawn-nearby-on-death: false

maxY: 128

# After teleporting, players will be prevented from teleporting again within this time.
# Can be bypassed with the simplertp.teleport.nocooldown permission.
teleport-cooldown-minutes: 10

blacklisted-biomes:
  - desert
  - ocean
  - warm_ocean
  - deep_ocean
  - frozen_ocean
  - deep_frozen_ocean
  - lukewarm_ocean
  - deep_lukewarm_ocean
  - cold_ocean
  - deep_cold_ocean
  - frozen_ocean
  - cold_ocean
  - lukewarm_ocean
  - warm_ocean
  - snowy_plains
  - river

blacklisted-blocks:
  - leaves

# The number of locations to generate for each region
target-locations-per-region: 10

regions:
  default:
    areas:
      - minX: -1000
        maxX: 1000
        minZ: -1000
        maxZ: 1000
